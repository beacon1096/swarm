---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 1h
  values:
    crds:
      enabled: true
    replicaCount: 1
    # Use Cloudflare DoH for self-checks so propagation is checked against
    # Cloudflare's public view.
    dns01RecursiveNameservers: https://1.1.1.1/dns-query,https://1.0.0.1/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
  # Keep the controller on host networking during the boundary-egress
  # cutover. Both host and PodCIDR egress now route through ms-r1.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: cert-manager
            patch: |
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
              - op: replace
                path: /spec/template/spec/dnsPolicy
                value: ClusterFirstWithHostNet
