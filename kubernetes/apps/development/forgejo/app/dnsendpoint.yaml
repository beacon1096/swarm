---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: forgejo-ssh
spec:
  endpoints:
    - dnsName: "git.${SECRET_DOMAIN}"
      recordType: A
      recordTTL: 300
      targets: ["103.118.41.228"]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
