---
# KasmVNC-based streaming Chromium. One container == one persistent
# browser reachable in the web UI. LinuxServer image runs its s6 init
# as root (PUID/PGID drop privileges internally), so no runAsNonRoot.
# Chromium needs an unconfined seccomp profile and a large /dev/shm.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kasm-browser
spec:
  chartRef:
    kind: OCIRepository
    name: kasm-browser
  interval: 1h
  values:
    controllers:
      kasm-browser:
        # Single writer against the /config Longhorn volume — never
        # overlap two pods.
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/chromium
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: Asia/Shanghai
              TITLE: Cluster Browser
              # KasmVNC HTTP UI port (HTTPS is 3001).
              CUSTOM_PORT: "3000"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 10
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        # Chromium's renderer sandbox needs the default seccomp
        # profile lifted; otherwise tabs crash on start.
        seccompProfile:
          type: Unconfined
    service:
      app:
        controller: kasm-browser
        ports:
          http:
            port: 3000
    persistence:
      config:
        existingClaim: kasm-browser-config
        globalMounts:
          - path: /config
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
    route:
      app:
        hostnames: ["browser.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
