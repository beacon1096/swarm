---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multica
spec:
  chartRef:
    kind: OCIRepository
    name: multica
  interval: 1h
  values:
    existingSecret: multica-secrets

    postgres:
      external:
        enabled: true

    backend:
      replicas: 1
      uploads:
        persistence:
          enabled: true
          size: 5Gi
          storageClass: longhorn-r3
      config:
        appEnv: production
        appUrl: "https://multica.${SECRET_DOMAIN}"
        frontendOrigin: "https://multica.${SECRET_DOMAIN}"
        corsAllowedOrigins: "https://multica.${SECRET_DOMAIN}"
        cookieDomain: ".${SECRET_DOMAIN}"
        allowSignup: false
        disableWorkspaceCreation: true
        vcsIntegrationEnabled: false
        localUploadBaseUrl: "https://multica.${SECRET_DOMAIN}"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    frontend:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    ingress:
      enabled: false

    monitoring:
      prometheusRule:
        enabled: false
