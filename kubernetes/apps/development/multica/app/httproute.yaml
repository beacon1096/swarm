---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: multica
spec:
  hostnames: ["multica.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: multica-backend
          port: 8080
    - backendRefs:
        - name: multica-frontend
          port: 3000
