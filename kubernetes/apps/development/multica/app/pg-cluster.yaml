---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: multica-pg
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  primaryUpdateStrategy: unsupervised

  storage:
    size: 8Gi
    storageClass: longhorn-r3

  bootstrap:
    initdb:
      database: multica
      owner: multica
      secret:
        name: multica-pg-app
      encoding: UTF8

  superuserSecret:
    name: multica-pg-superuser

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: false
