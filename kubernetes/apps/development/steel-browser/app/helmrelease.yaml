---
# Steel Browser (unified image): API + web session viewer on :3000
# (UI at /ui), Chrome DevTools Protocol on :9223. Chromium needs an
# unconfined seccomp profile and a large /dev/shm.
#
# DOMAIN/CDP_DOMAIN are the host:port Steel bakes into the URLs the /ui
# session viewer targets AND the connection URLs it returns to API clients.
# The human opens /ui over Tailscale, and the viewer/devtools must reach
# DOMAIN from the human's browser — so these are the tailnet MagicDNS name
# (same origin as the UI). Agents run in-cluster and can't reach the tailnet
# name, so they connect CDP at the in-cluster service directly, e.g.
# ws://steel-browser.development.svc.cluster.local:3000/ (swap the host in
# the returned websocketUrl) rather than using DOMAIN verbatim.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: steel-browser
spec:
  chartRef:
    kind: OCIRepository
    name: steel-browser
  interval: 1h
  values:
    controllers:
      steel-browser:
        # Single writer against the /app/.cache Longhorn volume.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/steel-dev/steel-browser
              tag: latest
            env:
              TZ: Asia/Shanghai
              DOMAIN: steel.tail5d550.ts.net:3000
              CDP_DOMAIN: steel.tail5d550.ts.net:9223
              LOG_STORAGE_ENABLED: "true"
              LOG_STORAGE_PATH: /data/logs/browser-logs.duckdb
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 10
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        # Chromium's renderer sandbox needs the default seccomp profile
        # lifted; otherwise tabs crash on start.
        seccompProfile:
          type: Unconfined
    service:
      app:
        controller: steel-browser
        ports:
          http:
            port: 3000
          cdp:
            port: 9223
    persistence:
      cache:
        existingClaim: steel-browser-cache
        globalMounts:
          - path: /app/.cache
      data:
        # Mount at /data/logs (not /data): Steel opens
        # /data/logs/browser-logs.duckdb but doesn't create the dir, so the
        # mount itself must provide it.
        type: emptyDir
        globalMounts:
          - path: /data/logs
      exports:
        type: emptyDir
        globalMounts:
          - path: /tmp/steel-browser-exports
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
    route:
      app:
        hostnames: ["steel.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
