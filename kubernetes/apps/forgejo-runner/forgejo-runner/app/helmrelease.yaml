---
# Forgejo Actions runner on talos-ii — DinD shape (act_runner +
# privileged dockerd sidecar). x86_64 only. Replaces the talos-i
# runner per spec 003 / plan 003 (Phase 1).
#
# === Why DinD over host-mode / podman ===
# Forward compat with future GitLab migrations + devcontainer-style
# CI workloads + arbitrary `container:` / `services:` / `uses:
# docker://...` workflow patterns. dind sidecar is privileged
# (mandatory for cgroup/iptables/netfilter); act_runner inherits
# privileged from chart default (hardening deferred per research Q4).
#
# === Egress envelope ===
# The in-cluster runner is disabled after a privileged DinD build
# exhausted a control-plane node. If re-enabled, both host and PodCIDR
# traffic use the ms-r1 boundary gateway without proxy environment
# variables.
# dockerd image pulls go via registry-mirror to in-cluster zot.
#
# === Image tag pinning ===
# - act_runner: code.forgejo.org/forgejo/runner:12.7.3 (multi-arch
#   manifest; resolves to amd64 on x86_64 nodes). Pulled through
#   in-cluster zot mirror.
# - dind: 172.16.87.51:5000/library/docker:29.2.1-dind (multi-arch
#   manifest; same idea). NOTE: swarm-01 pinned `-amd64` suffixed
#   tags but those literal tags do not exist upstream — discovered
#   at T003 pre-flight (tasks.md tag fact correction).
# - kubectl (chart's registration Job): chart-default
#   docker.io/alpine/kubectl:1.35.3 — Talos machine-registries proxies
#   docker.io through in-cluster zot, no override needed.
#
# === postRenderer patches ===
# 1. Keep the original hostNetwork topology for the disabled runner.
# 2. Mount dockerd-config ConfigMap at /etc/docker/daemon.json on dind
#    container (containers[1]) with subPath: daemon.json. subPath is
#    MANDATORY — without it the entire ConfigMap mount replaces all
#    of /etc/docker/, clobbering anything dockerd writes there at
#    runtime.
# 3. Add the corresponding `volume` entry referencing the ConfigMap.
# Container indices [0]=runner, [1]=dind verified for chart 0.7.6
# templates/deployment.yaml. If a future bump reorders, the daemon.json
# mount lands silently in the wrong container — verify post-apply
# with `yq '.spec.containers[].name'` (expect [runner, dind]).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 1h
  values:
    knownLastVersion: true
    # Incident hold: privileged DinD bypassed the expected nested build
    # resource boundary and exhausted a control-plane node.
    replicaCount: 0
    strategy:
      type: Recreate

    image:
      registry: code.forgejo.org
      repository: forgejo/runner
      tag: "12.7.3"

    dind:
      image:
        registry: 172.16.87.51:5000
        repository: library/docker
        tag: "29.2.1-dind"
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          # cpu deliberately omitted on dind to avoid throttling 3
          # concurrent nix builds on a single MS-01; node-level
          # capacity (16 vCPU per ms01) is the natural ceiling.
          memory: 8Gi

    # kubectl image — explicitly via in-cluster zot LB. Chart-default
    # docker.io/alpine/kubectl:1.35.3 fails on Talos because the
    # cluster's Spegel `_default` mirror catches docker.io pulls
    # with `resolve` capability and returns 404 for images not
    # already in the cluster's containerd cache (treated as
    # definitive, no fallthrough to upstream). zot proxies
    # docker.io and serves alpine/kubectl directly. Same pattern
    # we use for the dind image.
    kubectl:
      image:
        registry: 172.16.87.51:5000
        repository: alpine/kubectl
        tag: "1.35.3"

    runner:
      config:
        create: true
        existingInitSecret: "forgejo-runner-secret"
        file:
          runner:
            capacity: 3
            timeout: 12h
            labels:
              - "ubuntu-latest:docker://node:20.12-bookworm"
              - "nix-builder:docker://nixos/nix:latest"
          container:
            network: host
            valid_volumes: []
            options: "-v /workspace"
            privileged: false
            envs:
              # GOPROXY carried verbatim from swarm-01 v1 to avoid
              # surprise regression. The goproxy.cn middle hop can be
              # removed after the external runner path is stable.
              GOPROXY: "https://goproxy.cn,https://proxy.golang.org,direct"

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 512Mi

    securityContext:
      privileged: true

  # postRenderer:
  # 1. hostNetwork=true retains the runner's existing DinD topology.
  #    dnsPolicy=ClusterFirstWithHostNet keeps cluster CoreDNS available.
  # 2. Mount dockerd-config ConfigMap on dind container at
  #    /etc/docker/daemon.json (chart has no native knob;
  #    subPath is mandatory or the entire /etc/docker/ is
  #    clobbered).
  # No proxy environment is injected. Container indices [0]=runner,
  # [1]=dind are verified for chart 0.7.6 templates/deployment.yaml.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: forgejo-runner
            patch: |
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
              - op: replace
                path: /spec/template/spec/dnsPolicy
                value: ClusterFirstWithHostNet
              - op: add
                path: /spec/template/spec/containers/1/volumeMounts/-
                value:
                  name: dockerd-config
                  mountPath: /etc/docker/daemon.json
                  subPath: daemon.json
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: dockerd-config
                  configMap:
                    name: forgejo-runner-dockerd-config
                    items:
                      - key: daemon.json
                        path: daemon.json
