---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstatus-workflows
  labels:
    app.kubernetes.io/name: openstatus-workflows
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openstatus-workflows
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openstatus-workflows
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: workflows
          image: 172.16.87.51:5000/openstatushq/openstatus-workflows:ef7691a
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: openstatus-config
            - secretRef:
                name: openstatus-secret
          env:
            - name: OPENSTATUS_CONFIG_REVISION
              value: "2026-05-15-3"
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openstatus-workflows-data
---
apiVersion: v1
kind: Service
metadata:
  name: openstatus-workflows
spec:
  selector:
    app.kubernetes.io/name: openstatus-workflows
  ports:
    - name: http
      port: 3000
      targetPort: http
