---
# Tailscale operator. Watches Services with annotation
# `tailscale.com/expose: "true"` and provisions tailscale device
# nodes (proxies) for them, joining the cluster's tailnet.
#
# Used today by:
#   - forgejo-tailscale (development namespace)
#   - eventually: longhorn UI, attic, anything internal we want to
#     reach over the tailnet without going through Cloudflare.
#
# OAuth client credentials live in cluster-secrets. The client is
# tagged tag:talos-ii-operator (was tag:k8s-operator pre-rotation
# 2026-05-05; old client revoked after the kjnW… key was flagged by
# GitHub secret scanning — see cluster-secrets.sops.yaml.j2 header).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
spec:
  chartRef:
    kind: OCIRepository
    name: tailscale-operator
  interval: 1h
  values:
    oauth:
      clientId: "${SECRET_TAILSCALE_OAUTH_CLIENT_ID}"
      clientSecret: "${SECRET_TAILSCALE_OAUTH_CLIENT_SECRET}"
    operatorConfig:
      image:
        repository: ghcr.io/tailscale/k8s-operator
        tag: v1.96.5
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
        tag: v1.96.5
      # ts-* proxy pods (one per tailscale-exposed Service) join the
      # tailnet under tag:talos-ii-svc. tagOwners + autoApprovers for
      # this tag are set in the ACL JSON. Operator's own device picks
      # up tag:talos-ii-operator from the OAuth client itself.
      defaultTags: "tag:talos-ii-svc"
