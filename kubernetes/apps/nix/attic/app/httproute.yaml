---
# Public ingress uses envoy-external; LAN builders use envoy-internal.
# Authentication is enforced inside attic via the JWT bearer header
# (require-auth=true in server.toml), so both routes are pass-through.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: attic
spec:
  hostnames: ["nix.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: attic
          port: 8080
